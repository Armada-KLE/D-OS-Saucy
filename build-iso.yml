name: Build Saucy ISO

on:
  workflow_dispatch:      # gives you a "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-iso.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring \
            xorriso squashfs-tools

      - name: Configure image
        run: |
          mkdir -p "$HOME/saucy-build"
          cd "$HOME/saucy-build"
          lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --archive-areas "main non-free-firmware" \
            --mirror-bootstrap http://deb.debian.org/debian/ \
            --mirror-chroot http://deb.debian.org/debian/ \
            --mirror-binary http://deb.debian.org/debian/ \
            --binary-images iso-hybrid \
            --debian-installer none \
            --memtest none \
            --bootappend-live "boot=live components" \
            --iso-volume SAUCY \
            --iso-application "Saucy" \
            --iso-publisher "Saucy project" \
            --security false
          mkdir -p config/package-lists config/archives
          printf '%s\n' linux-image-amd64 systemd-sysv network-manager \
            firmware-iwlwifi sudo nano htop > config/package-lists/saucy.list.chroot
          # Debian security updates live under "trixie-security" now.
          # The old live-build tool asks for the retired "trixie/updates" name, so
          # we switch that off above and add the correct line here instead.
          echo "deb http://deb.debian.org/debian-security trixie-security main non-free-firmware" \
            > config/archives/security.list.chroot

      - name: Build ISO
        run: |
          cd "$HOME/saucy-build"
          sudo lb build 2>&1 | tee build.log

      - name: Checksum
        run: |
          cd "$HOME/saucy-build"
          ls -lh *.iso
          sha256sum *.iso | tee SHA256SUMS

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: saucy-iso
          path: |
            ~/saucy-build/*.iso
            ~/saucy-build/SHA256SUMS
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/saucy-build/build.log
          if-no-files-found: ignore
